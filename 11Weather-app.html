<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather-App</title>
  <link rel="stylesheet" href="CSS/11Weather-app.css">
</head>
<body>

  <div class="card">

    <h1>⛅ Weather</h1>

    <!-- Search row -->
    <div class="search-row">
        <input
            type="text"
            class="search-input"
            id="searchInput"
            placeholder="Enter city name...">
        <button class="search-btn" id="searchBtn">Search</button>
    </div>

    <!-- Error message -->
    <div class="error" id="error">
        City not found. Please try again.
    </div>

    <!-- Loading indicator -->
    <div class="loading" id="loading">
        Fetching weather...
    </div>

    <!-- Weather result — hidden until data loads -->
    <div class="weather-result" id="weatherResult">
      
    
        <div class="weather-icon" id="weatherIcon"></div>
        <div class="city-name" id="cityName"></div>
        <div class="country" id="country"></div>
        <div class="temperature" id="temperature"></div>
        <div class="description" id="description"></div>
  
        <div class="details">
            <div class="detail-item">
                <div class="detail-label">Feels Like</div>
                <div class="detail-value" id="feelsLike"></div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Humidity</div>
                <div class="detail-value" id="humidity"></div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Wind</div>
                <div class="detail-value" id="wind"></div>
            </div>
        </div>

    </div>

</div>



  </div>
  

  <script src="JS/11Weather-app.js"></script>
</body>
</html>
