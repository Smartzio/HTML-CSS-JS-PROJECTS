<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10-imageSlider</title>
  <link rel="stylesheet" href="CSS/10-imageSlider.css">
</head>
<body>
  <div class="slider" id="slider">

    <div class="sliderTrack" id="sliderTrack">

        <div class="slide">
          <img src="images/10Image-Slider/img1.jpg" alt="img1">
          <div class="slideCaption"> 
            <h3> Caption for slide 1 </h3>
            <p> This is a caption for slide 1 </p>
          </div>
        </div>

    </div>

    <button class="sliderBtn prevBtn" id="prevBtn">&#8592;</button>
    <button class="sliderBtn nextBtn" id="nextBtn">&#8594;</button>

    <div class="dots" id="dots"></div>

  </div>
  
  <script src="JS/10-imageSlider.js"></script>
</body>
</html>
