<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            background-color: #111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        /* ── Slider wrapper — clips the sliding track ── */
        .slider {
            position: relative;
            width: 800px;
            max-width: 95vw;
            height: 480px;
            overflow: hidden;
            border-radius: 12px;
        }

        /* ── Track — holds all slides side by side ── */
        .slider-track {
            display: flex;
            height: 100%;
            transition: transform 0.5s ease;
        }

        /* ── Individual slide ── */
        .slide {
            min-width: 100%;
            height: 100%;
            position: relative;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Slide caption */
        .slide-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px 25px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.75));
            color: white;
        }

        .slide-caption h3 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .slide-caption p {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.75);
        }

        /* ── Prev and Next buttons ── */
        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 2;
            transition: background-color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slider-btn:hover {
            background-color: rgba(0, 0, 0, 0.85);
        }

        .prev-btn { left: 15px; }
        .next-btn { right: 15px; }

        /* ── Dot indicators ── */
        .dots {
            display: flex;
            gap: 10px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background-color: white;
            transform: scale(1.3);
        }
    </style>
</head>

<body>

    <!-- Slider -->
    <div class="slider" id="slider">

        <!-- Sliding track — all slides sit inside here -->
        <div class="slider-track" id="sliderTrack">
            <!-- Slides injected by JS -->
        </div>

        <!-- Prev and Next buttons -->
        <button class="slider-btn prev-btn" id="prevBtn">&#8592;</button>
        <button class="slider-btn next-btn" id="nextBtn">&#8594;</button>

    </div>

    <!-- Dot indicators — outside the slider -->
    <div class="dots" id="dots"></div>

    <script>

        // ── Slide data ──
        const slides = [
            {
                image: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800",
                title: "Mountain Peaks",
                caption: "The silence above the clouds"
            },
            {
                image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800",
                title: "Ocean Horizon",
                caption: "Where the sea meets the sky"
            },
            {
                image: "https://images.unsplash.com/photo-1448375240586-882707db888b?w=800",
                title: "Forest Path",
                caption: "Lost in the right direction"
            },
            {
                image: "https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=800",
                title: "Desert Dunes",
                caption: "Where the wind writes stories"
            },
            {
                image: "https://images.unsplash.com/photo-1531366936337-7c912a4589a7?w=800",
                title: "Northern Lights",
                caption: "Nature's own light show"
            }
        ];

        // ── Grab elements ──
        const sliderTrack = document.getElementById("sliderTrack");
        const dotsContainer = document.getElementById("dots");
        const slider = document.getElementById("slider");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");

        let currentIndex = 0;
        let autoPlayTimer;

        // ── Build slides and dots from data ──
        slides.forEach((slide, index) => {

            // Create each slide
            sliderTrack.innerHTML += `
                <div class="slide">
                    <img src="${slide.image}" alt="${slide.title}">
                    <div class="slide-caption">
                        <h3>${slide.title}</h3>
                        <p>${slide.caption}</p>
                    </div>
                </div>
            `;

            // Create a dot for each slide
            dotsContainer.innerHTML += `
                <div class="dot ${index === 0 ? "active" : ""}" 
                     data-index="${index}">
                </div>
            `;
        });

        // Grab dots after they are created
        const dots = document.querySelectorAll(".dot");

        // ── Move to a specific slide ──
        function goToSlide(index) {

            // Wrap around if going past the ends
            if (index < 0) index = slides.length - 1;
            if (index >= slides.length) index = 0;

            currentIndex = index;

            // Slide the track by moving it left by currentIndex widths
            sliderTrack.style.transform = `translateX(-${currentIndex * 100}%)`;

            // Update dots — remove active from all, add to current
            dots.forEach((dot) => dot.classList.remove("active"));
            dots[currentIndex].classList.add("active");
        }

        // ── Button clicks ──
        prevBtn.addEventListener("click", () => goToSlide(currentIndex - 1));
        nextBtn.addEventListener("click", () => goToSlide(currentIndex + 1));

        // ── Dot clicks ──
        dots.forEach((dot) => {
            dot.addEventListener("click", () => {
                goToSlide(Number(dot.dataset.index));
            });
        });

        // ── Keyboard navigation ──
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") goToSlide(currentIndex - 1);
            if (e.key === "ArrowRight") goToSlide(currentIndex + 1);
        });

        // ── Auto play ──
        function startAutoPlay() {
            autoPlayTimer = setInterval(() => {
                goToSlide(currentIndex + 1);
            }, 3000);
        }

        function stopAutoPlay() {
            clearInterval(autoPlayTimer);
        }

        // Pause on hover, resume on mouse leave
        slider.addEventListener("mouseenter", stopAutoPlay);
        slider.addEventListener("mouseleave", startAutoPlay);

        // ── Start everything ──
        goToSlide(0);
        startAutoPlay();

    </script>

</body>
</html>
